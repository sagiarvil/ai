name: OmniCore Integrity & Verification Gates

on:
  push:
    branches: [ main, fix/verified-execution-loop ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify No UTF-8 BOM
        run: |
          find . -name "*.py" -o -name "*.json" -o -name "*.html" | while read -r file; do
            if [ -f "$file" ]; then
              if head -c 3 "$file" | grep -q $'\xEF\xBB\xBF'; then
                echo "HATA: UTF-8 BOM tespit edildi -> $file"
                exit 1
              fi
            fi
          done
          echo "UTF-8 BOM kontrolü: PASS"

      - name: Install runtime test dependencies
        run: python3 -m pip install "httpx>=0.27,<0.29" "fastapi>=0.115,<0.157"

      - name: Offline execution-loop regression tests
        run: python3 -m unittest -v test_execution_loop test_structured_actions test_acceptance_checks test_durable_runtime

      - name: Browser script syntax and integration tests
        run: |
          node --check public/app.js
          node --test test_local_ui.cjs

      - name: Syntax Compilation Check
        run: |
          python3 -m py_compile *.py
          echo "Python derleme kontrolü: PASS"

      - name: Security & Clean Env Verification
        run: |
          python3 -c "
          import re
          with open('omni_chat_panel.py') as f:
              content = f.read()
          assert '*' not in content.split('ALLOWED_ORIGINS')[1].split(']')[0], 'Wildcard CORS detected!'
          with open('real_engines.py') as f:
              re_content = f.read()
          assert 'verify=False' not in re_content, 'Unverified TLS detected!'
          print('Security lint check: PASS')
          "

