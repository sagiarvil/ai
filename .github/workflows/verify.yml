name: Baris local runtime verification

on:
  push:
    branches: [ main, fix/verified-execution-loop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned local runtime
        run: python -m pip install -r requirements-runtime.lock
      - name: Verify all offline and HTTP regression tests
        run: python -m unittest discover -v
      - name: Verify browser behavior
        run: |
          node --check public/app.js
          node --test test_local_ui.cjs
      - name: Check Python syntax and UTF-8 source encoding
        run: |
          python -m compileall -q .
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*'):
              if path.is_file() and path.suffix in {'.py', '.json', '.html', '.js', '.md'}:
                  raw = path.read_bytes()
                  assert not raw.startswith(b'\xef\xbb\xbf'), f'UTF-8 BOM: {path}'
                  raw.decode('utf-8')
          print('Kaynak kodlama kontrolü geçti.')
          PY
