name: OmniCore Gravity P0 Quality & Security Gates

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  verify_linux:
    name: Linux Security & Verification Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Security Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pytest ruff bandit pip-audit

      - name: Gate 1 - Verify UTF-8 BOM-Free
        run: |
          find . -name "*.py" -o -name "*.json" -o -name "*.html" | while read -r file; do
            if [ -f "$file" ]; then
              if head -c 3 "$file" | grep -q $'\xEF\xBB\xBF'; then
                echo "HATA: UTF-8 BOM tespit edildi -> $file"
                exit 1
              fi
            fi
          done
          echo "Gate 1 PASS: UTF-8 BOM-Free."

      - name: Gate 2 - Python Syntax Compilation Check
        run: |
          python3 -m py_compile *.py tests/*.py
          echo "Gate 2 PASS: Syntax Compile Check."

      - name: Gate 3 - Ruff Strict Code Quality Check (No Suppression)
        run: |
          ruff check .
          echo "Gate 3 PASS: Strict Ruff Lint Passed."

      - name: Gate 4 - Bandit Strict Security Scan (No Suppression)
        run: |
          bandit -r . -x ./tools,./sandbox_workspace,./tests,./omnicore_patch -ll
          echo "Gate 4 PASS: Bandit Security Scan Passed."

      - name: Gate 5 - P0 Regression & Security Test Suite
        env:
          PYTHONPATH: .
        run: |
          python3 -m pytest -v tests/test_gravity_p0.py tests/test_omnicore_x_contract.py tests/test_universal_installer.py
          echo "Gate 5 PASS: All P0 Security & Verification Tests Passed."

  verify_macos:
    name: macOS Seatbelt Kernel Sandbox Gate
    runs-on: macos-latest
    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pytest

      - name: Gate 6 - Real macOS Seatbelt Isolation Tests
        env:
          PYTHONPATH: .
        run: |
          python3 -m pytest -v tests/test_gravity_p0.py tests/test_omnicore_x_contract.py tests/test_universal_installer.py -k "sandbox or Seatbelt or denial"
          echo "Gate 6 PASS: macOS Kernel Seatbelt Sandbox Verified."
