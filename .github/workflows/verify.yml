name: OmniCore Integrity & Verification Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify No UTF-8 BOM
        run: |
          find . -name "*.py" -o -name "*.json" -o -name "*.html" | while read -r file; do
            if [ -f "$file" ]; then
              if head -c 3 "$file" | grep -q $'\xEF\xBB\xBF'; then
                echo "HATA: UTF-8 BOM tespit edildi -> $file"
                exit 1
              fi
            fi
          done
          echo "UTF-8 BOM kontrolü: PASS"

      - name: Syntax Compilation Check
        run: |
          python3 -m py_compile *.py
          echo "Python derleme kontrolü: PASS"

      - name: Security & Clean Env Verification
        run: |
          python3 -c "
          import re
          with open('omni_chat_panel.py') as f:
              content = f.read()
          assert '*' not in content.split('ALLOWED_ORIGINS')[1].split(']')[0], 'Wildcard CORS detected!'
          with open('real_engines.py') as f:
              re_content = f.read()
          assert 'verify=False' not in re_content, 'Unverified TLS detected!'
          print('Security lint check: PASS')
          "
