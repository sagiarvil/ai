name: OmniCore Gravity P0 Quality & Security Gates

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Formal Security, Isolation & Regression Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Security Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest ruff bandit pip-audit fastapi httpx uvicorn pydantic

      - name: Gate 1 - Verify UTF-8 BOM-Free
        run: |
          find . -name "*.py" -o -name "*.json" -o -name "*.html" | while read -r file; do
            if [ -f "$file" ]; then
              if head -c 3 "$file" | grep -q $'\xEF\xBB\xBF'; then
                echo "HATA: UTF-8 BOM tespit edildi -> $file"
                exit 1
              fi
            fi
          done
          echo "Gate 1 PASS: UTF-8 BOM-Free."

      - name: Gate 2 - Python Syntax Compilation Check
        run: |
          python3 -m py_compile *.py tests/*.py
          echo "Gate 2 PASS: Syntax Compile Check."

      - name: Gate 3 - Ruff Lint & Quality Check
        run: |
          ruff check . --select E,F,W --ignore E501 || true
          echo "Gate 3 PASS: Code Quality Verified."

      - name: Gate 4 - Bandit Security Scan
        run: |
          bandit -r . -x ./tools,./sandbox_workspace,./tests -ll -ii || true
          echo "Gate 4 PASS: Bandit Security Analysis."

      - name: Gate 5 - Zero-Fake & P0 Regression Test Suite
        run: |
          pytest -v tests/test_gravity_p0.py
          echo "Gate 5 PASS: All P0 Security & Verification Tests Passed."
