<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barış AI // Ultra-Fast Engineering Console & Jarvis</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0c10;
      --panel: #11141a;
      --border: #1e2430;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #2f81f7;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    header {
      height: 46px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-size: 11px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }
    .voice-btn {
      background: #161b22;
      border: 1px solid var(--border);
      color: var(--green);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .voice-btn:hover {
      border-color: var(--accent);
      background: #1f242c;
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }
    .msg-user {
      align-self: flex-end;
      background: #1f304d;
      border: 1px solid #284470;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 80%;
      white-space: pre-wrap;
    }
    .msg-ai {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      line-height: 1.5;
    }
    .msg-ai pre {
      background: #060709;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-ai code {
      font-family: var(--mono);
      color: #79c0ff;
      font-size: 12px;
    }
    .steps {
      border-left: 2px solid var(--accent);
      padding-left: 10px;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
    }
    .attachment-tray {
      max-width: 960px;
      margin: 0 auto 6px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .attachment-chip {
      background: #161b22;
      border: 1px solid var(--accent);
      color: #79c0ff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .attachment-chip .remove-btn {
      color: var(--muted);
      cursor: pointer;
      font-weight: bold;
    }
    .attachment-chip .remove-btn:hover {
      color: var(--red);
    }
    .input-box {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 6px;
      resize: none;
      height: 48px;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .tool-btn, .mic-btn {
      background: #161b22;
      border: 1px solid var(--border);
      color: var(--text);
      width: 48px;
      height: 48px;
      border-radius: 6px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tool-btn:hover, .mic-btn:hover {
      border-color: var(--accent);
      background: #1f242c;
    }
    .mic-btn.listening {
      background: #3c1618;
      border-color: var(--red);
      color: var(--red);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(248, 81, 73, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
    }
    button.send {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 20px;
      height: 48px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }
    button.stop-btn {
      background: #da3633;
      color: #fff;
      border: none;
      padding: 0 20px;
      height: 48px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.stop-btn:hover { background: #b62324; }
    .footer-bar {
      max-width: 960px;
      margin: 6px auto 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .quick-bar {
      display: flex;
      gap: 8px;
      font-size: 10px;
      color: var(--muted);
      overflow-x: auto;
      white-space: nowrap;
      padding-top: 2px;
    }
    .quick-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .quick-chip:hover { color: var(--text); border-color: var(--muted); }
    .char-counter {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      font-family: var(--mono);
      padding: 2px 6px;
    }
    .char-counter.warning { color: var(--orange); }
    .char-counter.danger { color: var(--red); font-weight: bold; }
    /* --- JARVIS NEON AUDIO EQUALIZER --- */
    .visualizer-container {
      max-width: 960px;
      margin: 0 auto 4px auto;
      background: #090a0f;
      border: 1px solid #1c1f26;
      border-radius: 4px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: none;
      transition: border-color 0.3s;
      cursor: pointer;
      user-select: none;
    }
    .visualizer-container:hover {
      border-color: #3b1d22;
    }
    .visualizer-container.active {
      border-color: #632228;
      background: #0d0a0c;
    }
    .visualizer-canvas {
      flex: 1;
      height: 12px;
      width: 100%;
      border-radius: 2px;
      background: #06070a;
    }
    .visualizer-meta {
      font-size: 11px;
      font-family: var(--mono);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 150px;
      text-align: right;
    }
    .visualizer-status {
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    .visualizer-db {
      color: #06b6d4;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:8px;">
      <img src="/favicon.png" alt="Barış AI Logo" style="width:22px; height:22px; border-radius:5px; box-shadow:0 0 8px rgba(6,182,212,0.4);">
      <span>BARIŞ AI // JARVIS & FAST EXECUTION CORE</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="jarvisPowerBtn" onclick="toggleJarvisPower()" class="voice-btn" style="background:#3c1618; border-color:#da3633; color:#f85149; font-weight:bold;" title="Jarvis ve KITT Lazer sistemini aç veya kapat">🔴 Jarvis: AÇIK</button>
      <button id="voiceToggleBtn" onclick="toggleVoice()" class="voice-btn" title="Sesli yanıtları aç/kapat">🔊 Ses: Açık</button>
      <button id="clearChatBtn" onclick="clearChatHistory()" class="voice-btn" style="color:var(--muted); border-color:var(--border);" title="Konuşma geçmişini ve ekranı temizle">🗑️ Temizle</button>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="sysStatus">Apple M4 Metal</span>
      </div>
    </div>
  </header>

  <div id="feed"></div>

  <footer>
    <div id="attachmentTray" class="attachment-tray"></div>
    <div id="visualizerContainer" class="visualizer-container" onclick="enableAudioAndListen()" title="Canlı Renkli Ekolayzırı ve Sesli Dinlemeyi Başlatmak / Açmak İçin Tıklayın">
      <div style="font-size:16px; color:#06b6d4;" title="Canlı Ses Dalga Analizi">⚡</div>
      <canvas id="audioVisualizer" class="visualizer-canvas" width="640" height="12"></canvas>
      <div class="visualizer-meta">
        <div id="visualizerStatus" class="visualizer-status"><span id="vStatusDot" style="color:#ef4444;">🔴</span> <span id="vStatusText" style="color:#94a3b8;">KITT Lazer Aktif</span></div>
        <div id="visualizerDb" class="visualizer-db">Dinlemeye hazır</div>
      </div>
    </div>
    <div class="input-box">
      <input type="file" id="fileUploadInput" multiple accept=".pdf,.doc,.docx,.txt,.md,.py,.js,.json,.png,.jpg,.jpeg,.webp,.csv" style="display:none;" onchange="handleFileUpload(event)">
      <button type="button" class="tool-btn" onclick="document.getElementById('fileUploadInput').click()" title="Dosya veya Görsel Ekle (PDF, Word, Görsel, Kod)">📎</button>
      <textarea id="promptInput" maxlength="5000" placeholder="Emir ver, dosya üret veya Jarvis gibi dobra sohbet et... (5000 karaktere kadar)" autofocus></textarea>
      <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Sesle konuş (Mikrofon)">🎙️</button>
      <button class="send" id="sendBtn" onclick="sendAction()">İCRA ET</button>
      <button class="stop-btn" id="stopBtn" onclick="stopAction()" style="display:none;" title="İşlemi anında durdur">⏹ DURDUR</button>
    </div>
    <div class="footer-bar">
      <div class="quick-bar">
        <span class="quick-chip" onclick="quickFill('Selam Barış, nasılsın? Durumlar ne?')">💬 Jarvis Sohbet</span>
        <span class="quick-chip" onclick="quickFill('Sistemine kurulan tüm motorları ve aktif yetenekleri listele')">📦 Kurulu Motorlar</span>
        <span class="quick-chip" onclick="quickFill('/Users/macair1/projects dizinindeki projeleri analiz et')">📁 Projeleri Tara</span>
        <span class="quick-chip" onclick="quickFill('Chrome ile https://checkip.amazonaws.com adresine bağlan ve kaydet')">🌐 Chrome Ziyaret</span>
        <span class="quick-chip" onclick="quickFill('Crawl4AI ile https://example.com sayfasını kazı')">🕷️ Crawl4AI Kazıma</span>
      </div>
      <div id="charCounter" class="char-counter">0 / 5000</div>
    </div>
  </footer>

  <script>
    const feed = document.getElementById('feed');
    const input = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const micBtn = document.getElementById('micBtn');
    const charCounter = document.getElementById('charCounter');
    const attachmentTray = document.getElementById('attachmentTray');
    let history = [];
    let pendingAttachments = [];
    let currentAbortController = null;

    // --- KARAKTER SAYACI (0 - 5000) ---
    input.addEventListener('input', () => {
      const len = input.value.length;
      charCounter.textContent = `${len} / 5000`;
      if (len >= 5000) {
        charCounter.className = 'char-counter danger';
      } else if (len >= 4500) {
        charCounter.className = 'char-counter warning';
      } else {
        charCounter.className = 'char-counter';
      }
    });

    // --- DOSYA VE BELGE YÜKLEME (PDF, WORD, GÖRSEL, METİN) ---
    async function handleFileUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') ? '' : 'http://127.0.0.1:5050';
      const apiKey = (window.OMNI_KEY || localStorage.getItem('omni_key') || '').trim();

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const formData = new FormData();
        formData.append('file', file);

        // Geçici yükleniyor çipi
        const tempChip = document.createElement('div');
        tempChip.className = 'attachment-chip';
        tempChip.textContent = `⏳ Yükleniyor: ${file.name}...`;
        attachmentTray.appendChild(tempChip);

        try {
          const res = await fetch(API_BASE + '/api/upload', {
            method: 'POST',
            headers: {
              'X-Omni-Key': apiKey
            },
            body: formData
          });

          if (res.ok) {
            const data = await res.json();
            pendingAttachments.push(data);
            renderAttachmentTray();
          } else {
            tempChip.style.borderColor = 'var(--red)';
            tempChip.style.color = 'var(--red)';
            tempChip.textContent = `❌ ${file.name} yüklenemedi`;
            setTimeout(() => tempChip.remove(), 3000);
          }
        } catch(e) {
          tempChip.style.borderColor = 'var(--red)';
          tempChip.style.color = 'var(--red)';
          tempChip.textContent = `❌ Hata: ${e.message}`;
          setTimeout(() => tempChip.remove(), 3000);
        }
      }
      event.target.value = '';
    }

    function renderAttachmentTray() {
      attachmentTray.innerHTML = '';
      pendingAttachments.forEach((att, index) => {
        const chip = document.createElement('div');
        chip.className = 'attachment-chip';
        const icon = att.file_type.includes('PDF') ? '📄' : (att.file_type.includes('Word') ? '📝' : (att.file_type.includes('Görsel') ? '🖼️' : '📁'));
        chip.innerHTML = `${icon} <strong>${att.filename}</strong> (${att.file_type}) <span class="remove-btn" onclick="removeAttachment(${index})">✕</span>`;
        attachmentTray.appendChild(chip);
      });
    }

    function removeAttachment(index) {
      pendingAttachments.splice(index, 1);
      renderAttachmentTray();
    }

    // --- SESLİ YANIT (TTS) YÖNETİMİ ---
    
    // --- JARVIS GÜÇ ANAHTARI (ON / OFF) ---
    function toggleJarvisPower() {
      jarvisPowerOn = !jarvisPowerOn;
      const btn = document.getElementById('jarvisPowerBtn');
      if (jarvisPowerOn) {
        if (btn) {
          btn.textContent = '🔴 Jarvis: AÇIK';
          btn.style.background = '#3c1618';
          btn.style.borderColor = '#da3633';
          btn.style.color = '#f85149';
        }
        input.placeholder = 'Emir ver veya Jarvis gibi dobra sohbet et... (Enter ile gönder)';
      } else {
        if (btn) {
          btn.textContent = '⚪ Jarvis: KAPALI';
          btn.style.background = '#161b22';
          btn.style.borderColor = '#30363d';
          btn.style.color = '#8b949e';
        }
        // Tüm konuşma ve sesleri salisesinde öldür
        stopAction();
        if (recognition) {
          try { recognition.abort(); } catch(e){}
        }
        input.placeholder = 'Jarvis kapatıldı. Açmak için yukarıdaki "Jarvis: KAPALI" butonuna tıklayın.';
      }
    }

    let voiceEnabled = localStorage.getItem('baris_voice') !== 'false';
    function updateVoiceBtn() {
      const btn = document.getElementById('voiceToggleBtn');
      if (btn) {
        btn.textContent = voiceEnabled ? '🔊 Ses: Açık' : '🔇 Ses: Kapalı';
        btn.style.color = voiceEnabled ? 'var(--green)' : 'var(--muted)';
      }
    }
    updateVoiceBtn();

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      localStorage.setItem('baris_voice', voiceEnabled);
      updateVoiceBtn();
      if (!voiceEnabled) {
        fetch('/api/voice/stop', { method: 'POST' }).catch(() => {});
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        isSpeakingNow = false;
      }
    }

    function cleanMarkdownForSpeech(md) {
      if (!md) return '';
      return md
        .replace(/```[\s\S]*?```/g, 'İlgili kod veya aşamalar tamamlandı.')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
        .replace(/[#*_\->~]/g, '')
        .replace(/\n+/g, ' ')
        .trim();
    }

    function clearChatHistory() {
      // 1. Süren işlemleri ve konuşmaları derhal sustur
      stopAction();
      // 2. Hafızayı ve ekleri sıfırla
      history = [];
      pendingAttachments = [];
      renderAttachmentTray();
      // 3. Sohbet alanını tertemiz bomboş yap
      feed.innerHTML = '';
      feed.scrollTop = 0;
      input.value = '';
      input.dispatchEvent(new Event('input'));
      input.focus();
    }

    function speakJarvis(text) {
      if (!jarvisPowerOn || !voiceEnabled) return;
      const clean = cleanMarkdownForSpeech(text);
      if (!clean) return;

      // 1. MİKROFONU MUTLAK SUSTUR (Hoparlör sesini dinleyip papağan gibi tekrar etmesin)
      isSpeakingNow = true;
      if (recognition) {
        try { recognition.abort(); } catch(e){}
      }

      // 2. ÇİFT SES ÇAKIŞMASINI BİTİR: window.speechSynthesis ASLA ÇAĞRILMAZ, SADECE YEREL MACOS SAY
      fetch('/api/voice/speak', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: clean.substring(0, 350)})
      }).then(() => {
        const duration = Math.min(8000, Math.max(1500, clean.length * 65));
        setTimeout(() => {
          isSpeakingNow = false;
          if (jarvisPowerOn && alwaysListen) {
            try { recognition.start(); } catch(e){}
          }
        }, duration + 1500);
      }).catch(() => {
        isSpeakingNow = false;
      });
    }

    // --- JARVIS & KITT SES VE LAZER ÇEKİRDEĞİ (WEB AUDIO API & CANVAS) ---
    const visualizerCanvas = document.getElementById('audioVisualizer');
    const visualizerCtx = visualizerCanvas ? visualizerCanvas.getContext('2d') : null;
    const vContainer = document.getElementById('visualizerContainer');
    const vStatusDot = document.getElementById('vStatusDot');
    const vStatusText = document.getElementById('vStatusText');
    const vDb = document.getElementById('visualizerDb');

    let audioContext = null;
    let analyserNode = null;
    let micStream = null;
    let freqData = null;
    let isAudioEngineStarted = false;

    const KITT_SEGMENTS = 48;
    let kittScanPos = 0;
    let kittScanDir = 1;
    let kittTrail = new Array(KITT_SEGMENTS).fill(0);
    let jarvisPowerOn = true;

    // Fütüristik İki Tonlu Uyanma Chime (880Hz -> 1320Hz)
    function playWakeChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = audioContext || new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch(e) {}
    }

    async function initAudioEngine() {
      if (isAudioEngineStarted && audioContext && audioContext.state === 'running') return true;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        if (!audioContext) {
          audioContext = new AudioCtx();
        }
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: false,
              autoGainControl: true
            }
          });
        }

        const source = audioContext.createMediaStreamSource(micStream);
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 64;
        analyserNode.smoothingTimeConstant = 0.72;
        source.connect(analyserNode);

        freqData = new Uint8Array(analyserNode.frequencyBinCount);
        isAudioEngineStarted = true;
        return true;
      } catch (err) {
        console.warn('Web Audio API başlatma:', err);
        return false;
      }
    }

    function renderVisualizer() {
      if (!visualizerCtx || !visualizerCanvas) return;
      requestAnimationFrame(renderVisualizer);

      const width = visualizerCanvas.width;
      const height = visualizerCanvas.height;

      visualizerCtx.clearRect(0, 0, width, height);
      visualizerCtx.fillStyle = '#06070a';
      visualizerCtx.fillRect(0, 0, width, height);

      // EĞER JARVIS KAPALIYSA: KITT LAZERİ SÖNER
      if (!jarvisPowerOn) {
        visualizerCtx.fillStyle = '#171922';
        visualizerCtx.fillRect(4, Math.round(height/2)-1, width-8, 1);
        if (vStatusDot) vStatusDot.textContent = '⚫';
        if (vStatusText) { vStatusText.textContent = 'Jarvis Kapalı (Uyuyor)'; vStatusText.style.color = '#64748b'; }
        if (vDb) vDb.textContent = 'Devre dışı';
        return;
      }

      const barCount = KITT_SEGMENTS;
      const barWidth = Math.floor(width / barCount) - 2;
      let x = 3;
      let sum = 0;

      let hasSound = false;
      let avg = 0;
      if (isAudioEngineStarted && analyserNode && freqData) {
        analyserNode.getByteFrequencyData(freqData);
        for (let i = 0; i < freqData.length; i++) sum += freqData[i];
        avg = sum / freqData.length;
        hasSound = avg > 12;
      }

      // KITT LAZER AKIŞI: Jarvis AÇIK ise her zaman akar!
      const scanSpeed = hasSound ? Math.min(0.035, 0.016 + (avg / 255) * 0.03) : 0.012;
      kittScanPos += kittScanDir * scanSpeed;
      if (kittScanPos >= 1) { kittScanPos = 1; kittScanDir = -1; }
      else if (kittScanPos <= 0) { kittScanPos = 0; kittScanDir = 1; }

      const activeBarCenter = kittScanPos * (barCount - 1);
      const centerY = height / 2;

      for (let i = 0; i < barCount; i++) {
        const dist = Math.abs(i - activeBarCenter);
        const intensity = Math.max(0, 1 - (dist / 2.5));

        kittTrail[i] = Math.max(kittTrail[i] * 0.85, intensity);
        const currentBright = Math.max(kittTrail[i], intensity);

        let barHeight = currentBright > 0.6 ? 2.5 : 1.5;
        if (hasSound) {
          barHeight = currentBright > 0.6 ? 3.5 : 2;
        }

        // SOLUK MATTE KIRMIZI (Gözü yormayan asil KITT kırmızısı)
        if (currentBright > 0.7) {
          visualizerCtx.fillStyle = '#f87171'; // Yumuşak açık kırmızı
        } else if (currentBright > 0.35) {
          visualizerCtx.fillStyle = '#991b1b'; // Koyu kırmızı
        } else if (currentBright > 0.12) {
          visualizerCtx.fillStyle = '#4c0519'; // Soluk iz
        } else {
          visualizerCtx.fillStyle = '#171922'; // Taban rayı
        }

        const yPos = Math.round(centerY - (barHeight / 2));
        visualizerCtx.fillRect(x, yPos, barWidth, Math.round(barHeight));
        x += barWidth + 2;
      }

      if (hasSound) {
        if (vStatusDot) vStatusDot.textContent = '🔴';
        if (vStatusText) { vStatusText.textContent = '⚡ KITT Ses Algılıyor'; vStatusText.style.color = '#ef4444'; }
        if (vDb) vDb.textContent = 'Şiddet: %' + Math.min(100, Math.round((avg / 90) * 100));
      } else {
        if (vStatusDot) vStatusDot.textContent = '🔴';
        if (vStatusText) { vStatusText.textContent = 'KITT Lazer Aktif'; vStatusText.style.color = '#94a3b8'; }
        if (vDb) vDb.textContent = 'Dinlemeye hazır';
      }
    }

    // Sayfa açılır açılmaz render döngüsünü başlat
    requestAnimationFrame(renderVisualizer);

    // --- MİKROFON İLE KESİNTİSİZ HANDS-FREE JARVIS DİNLEME MİMARİSİ ---
    let recognition = null;
    let isListening = false;
    let alwaysListen = localStorage.getItem('always_listen') === 'true'; // İstenmedikçe çevre sesleri devreye girmez // Varsayılan olarak AÇIK
    let isSpeakingNow = false;
    let restartTimer = null;
    let wakeChimedForTurn = false;
    let speechDebounceTimer = null;

    function updateWakeWordBtn() {
      const btn = document.getElementById('wakeWordToggleBtn');
      if (btn) {
        btn.textContent = alwaysListen ? '🎯 Jarvis Dinlemede: Açık' : '🎯 Jarvis Dinlemede: Kapalı';
        btn.style.borderColor = alwaysListen ? '#06b6d4' : '#1e2430';
        btn.style.color = alwaysListen ? '#06b6d4' : '#e6edf3';
      }
    }
    updateWakeWordBtn();

    function toggleWakeWord() {
      alwaysListen = !alwaysListen;
      localStorage.setItem('always_listen', alwaysListen ? 'true' : 'false');
      updateWakeWordBtn();
      if (alwaysListen) {
        enableAudioAndListen();
      } else {
        stopContinuousListening();
      }
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.lang = 'tr-TR';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        wakeChimedForTurn = false;
        if (micBtn) {
          micBtn.classList.add('listening');
          micBtn.textContent = '🔴';
          micBtn.title = 'Jarvis sizi dinliyor... Konuşun veya tıklayıp kapatın';
        }
        input.placeholder = alwaysListen
          ? '🎯 Jarvis uyanık! "Jarvis..." diye seslendiğiniz anda dinler...'
          : 'Dinleniyor... Konuşun...';
      };

      recognition.onresult = (event) => {
        if (!jarvisPowerOn) return; // Güç kapalıysa yok say

        let interim = '';
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        const text = (finalTranscript || interim).trim();
        if (!text || text.length < 2) return;

        const lower = text.toLowerCase();

        // 🛡️ PAPAĞAN VE HOPARLÖR YANKI ENGELİ: Jarvis kendi sesini duyduysa KESİNLİKLE YOK SAY!
        const selfEchoFilter = ['selam patron', 'buradayım dinliyorum', 'bütün sistemler aktif', 'ne yapıyoruz', 'sıkma tatlı canını', 'm4 canavar gibi'];
        if (selfEchoFilter.some(w => lower.includes(w))) {
          console.warn('Jarvis kendi sesini duydu, yok sayıldı.');
          return;
        }
        const wakeWords = ['jarvis', 'jarjis', 'carvis', 'yarvis', 'barış', 'baris', 'patron', 'hey jarvis', 'merhaba jarvis', 'alo jarvis'];
        const hasWakeWord = wakeWords.some(w => lower.includes(w));

        if (alwaysListen) {
          if (hasWakeWord) {
            // Uyanma Chime'ı
            if (!wakeChimedForTurn) {
              playWakeChime();
              wakeChimedForTurn = true;
            }
            if (vContainer) vContainer.classList.add('active');
            if (vStatusDot) vStatusDot.textContent = '🔵';
            if (vStatusText) {
              vStatusText.textContent = '🎯 JARVIS DEVREDE!';
              vStatusText.style.color = '#38bdf8';
            }
            input.value = text;
            input.dispatchEvent(new Event('input'));
            input.placeholder = '⚡ Jarvis emri dinliyor... Cümlenizi tamamlayın...';

            clearTimeout(speechDebounceTimer);
            // Kullanıcı cümlesini tamamen bitirip odada sessizlik olana kadar bekle (stabilite)
            const waitTime = finalTranscript ? 500 : 1100;
            speechDebounceTimer = setTimeout(() => {
              wakeChimedForTurn = false;
              try { recognition.stop(); } catch(e){}
              sendAction();
            }, waitTime);
          } else {
            input.placeholder = '🛡️ Çevre sesi elendi ("Jarvis" bekleniyor)...';
          }
        } else {
          input.value = text;
          input.dispatchEvent(new Event('input'));
          clearTimeout(speechDebounceTimer);
          speechDebounceTimer = setTimeout(() => {
            sendAction();
          }, 500);
        }
      };

      recognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
          console.warn('SpeechRec hatası:', event.error);
        }
      };

      recognition.onend = () => {
        isListening = false;
        wakeChimedForTurn = false;
        if (micBtn) {
          micBtn.classList.remove('listening');
          micBtn.textContent = '🎙️';
        }
        // Eğer hands-free mod açıksa ve sistem şu an konuşmuyorsa otomatik yeniden başlat
        if (alwaysListen && !isSpeakingNow) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            try {
              recognition.start();
            } catch(e) {}
          }, 350);
        }
      };
    } else {
      if (micBtn) {
        micBtn.title = 'Tarayıcınız Web Speech API mikrofonunu desteklemiyor';
        micBtn.style.opacity = '0.4';
      }
    }

    async function startContinuousListening() {
      await initAudioEngine();
      if (!recognition) return;
      try {
        recognition.start();
      } catch(e) {
        // Zaten çalışıyorsa sessiz geç
      }
    }

    function stopContinuousListening() {
      if (!recognition) return;
      clearTimeout(restartTimer);
      clearTimeout(speechDebounceTimer);
      try {
        recognition.stop();
      } catch(e) {}
      if (micBtn) {
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎙️';
      }
      input.placeholder = 'Emir ver veya Jarvis gibi dobra sohbet et... (Enter ile gönder)';
    }

    async function enableAudioAndListen() {
      const ok = await initAudioEngine();
      if (ok && alwaysListen) {
        startContinuousListening();
      } else if (ok && !alwaysListen) {
        startContinuousListening();
      }
    }

    async function toggleMic() {
      if (!jarvisPowerOn) {
        toggleJarvisPower(); // Jarvis kapalıysa aç
      }
      await initAudioEngine();
      if (!recognition) {
        alert('Tarayıcınız ses tanıma (Web Speech API) özelliğini desteklemiyor.');
        return;
      }
      if (isListening) {
        try { recognition.stop(); } catch(e){}
        isListening = false;
        if (micBtn) {
          micBtn.classList.remove('listening');
          micBtn.textContent = '🎙️';
        }
        input.placeholder = 'Emir ver veya Jarvis gibi dobra sohbet et... (Enter ile gönder)';
      } else {
        try {
          recognition.start();
          isListening = true;
          if (micBtn) {
            micBtn.classList.add('listening');
            micBtn.textContent = '🔴';
          }
          input.placeholder = '🎙️ Dinleniyor... Konuşun (cümle bitince otomatik gönderir)...';
        } catch(e) {
          console.warn('Mikrofon başlatma hatası:', e);
        }
      }
    }

    // Sayfaya ilk kullanıcı etkileşiminde (tıklama, dokunma, tuş) mikrofonu ve ekolayzırı otomatik uyandır
    ['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
      document.addEventListener(evt, () => {
        enableAudioAndListen();
      }, { once: true });
    });

        function quickFill(txt) {
      input.value = txt;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendAction();
      }
    });

    const keyInput = document.getElementById('omniKeyInput');
    if (keyInput) {
      if (keyInput.value) {
        localStorage.setItem('omni_key', keyInput.value.trim());
      } else {
        const savedKey = localStorage.getItem('omni_key');
        if (savedKey) keyInput.value = savedKey;
      }
      keyInput.addEventListener('change', () => {
        localStorage.setItem('omni_key', keyInput.value.trim());
      });
    }

    // --- İŞLEMİ DURDURMA (STOP ACTION) ---
    function stopAction() {
      // macOS yerel say sürecini anında öldür
      fetch('/api/voice/stop', { method: 'POST' }).catch(() => {});
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      isSpeakingNow = false;

      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      sendBtn.disabled = false;
      sendBtn.textContent = 'İCRA ET';
      sendBtn.style.opacity = '1';
      stopBtn.style.display = 'none';

      const lastAi = feed.querySelector('.msg-ai:last-child');
      if (lastAi && lastAi.innerHTML.includes('⚡')) {
        lastAi.innerHTML = '<strong style="color:var(--red)">⏹ [DURDURULDU]: Ses ve işlem anında durduruldu.</strong>';
      }
    }

    async function sendAction() {
      const q = input.value.trim();
      if (!q && pendingAttachments.length === 0) return;

      const welcome = document.getElementById('welcomeMsg');
      if (welcome) welcome.remove();

      input.value = '';
      input.dispatchEvent(new Event('input'));

      // BUTON GÜVENLİĞİ: İcra butonu gizlenmez, sadece kilitlenir; böylece kullanıcı kazara durdur'a basamaz
      sendBtn.disabled = true;
      sendBtn.textContent = '⚡ Düşünülüyor...';
      sendBtn.style.opacity = '0.75';
      stopBtn.style.display = 'inline-flex';

      // Kullanıcı mesajı
      const uDiv = document.createElement('div');
      uDiv.className = 'msg-user';
      let userDisplay = q;
      if (pendingAttachments.length > 0) {
        const attNames = pendingAttachments.map(a => '📎 ' + a.filename).join(', ');
        userDisplay = "[" + attNames + "]\n" + (q || "(Belgeler inceleniyor)");
      }
      uDiv.textContent = userDisplay;
      feed.appendChild(uDiv);
      feed.scrollTop = feed.scrollHeight;

      // AI Canlı Bekleme Kutusu ve Kronometresi
      const aDiv = document.createElement('div');
      aDiv.className = 'msg-ai';
      aDiv.innerHTML = '<em>⚡ Jarvis düşünüyor ve hazırlıyor... (<span id="liveTimer">0.0s</span>)</em>';
      feed.appendChild(aDiv);
      feed.scrollTop = feed.scrollHeight;

      const t0 = performance.now();
      const timerEl = aDiv.querySelector('#liveTimer');
      const liveInterval = setInterval(() => {
        if (timerEl) {
          const sec = ((performance.now() - t0) / 1000).toFixed(1);
          timerEl.textContent = sec + 's';
        }
      }, 100);

      const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') ? '' : 'http://127.0.0.1:5050';
      const apiKey = (window.OMNI_KEY || localStorage.getItem('omni_key') || '').trim();

      const attachmentsToSend = [...pendingAttachments];
      pendingAttachments = [];
      renderAttachmentTray();

      currentAbortController = new AbortController();

      try {
        const res = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          signal: currentAbortController.signal,
          headers: {
            'Content-Type': 'application/json',
            'X-Omni-Key': apiKey
          },
          body: JSON.stringify({
            message: q,
            history: history,
            attachments: attachmentsToSend
          })
        });

        clearInterval(liveInterval);

        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          const raw = await res.text();
          throw new Error('Yerel backend servisine (http://127.0.0.1:5050) ulaşılamadı. Backend terminalde çalışıyor mu kontrol edin.');
        }

        if (res.ok) {
          const data = await res.json();
          const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
          
          let outHtml = '';
          if (data.execution_steps && data.execution_steps.length > 0) {
            outHtml += '<div class="steps">';
            data.execution_steps.forEach(st => {
              const stepName = st.tool || st.step || 'Aşama';
              const stepDetail = st.output || (st.exit_code !== undefined ? 'exit ' + st.exit_code : 'Tamamlandı');
              outHtml += '▸ <strong>' + stepName + '</strong> (' + stepDetail.substring(0, 100).replace(/\n/g, ' ') + ')<br>';
            });
            outHtml += '</div>';
          }

          outHtml += marked.parse(data.reply || '');
          outHtml += '<div style="font-size:10px; color:var(--muted); margin-top:8px;">⏱ Süre: ' + elapsed + 's • Durum: ' + data.status + '</div>';
          aDiv.innerHTML = outHtml;

          history.push({ role: 'user', content: q }, { role: 'assistant', content: data.reply });

          // Jarvis sesli konuşma (Yerel macOS Yelda motoru)
          if (jarvisPowerOn) {
            speakJarvis(data.reply);
          }
        } else if (res.status === 401) {
          aDiv.innerHTML = '<span style="color:#f85149">⛔ Yetkisiz Erişim (HTTP 401): Geçersiz veya eksik API Anahtarı. Lütfen sağ üstteki "X-Omni-Key" alanına geçerli anahtarınızı girin.</span>';
        } else {
          aDiv.innerHTML = '<span style="color:#f85149">Hata: Sunucu ' + res.status + ' yanıtı döndü.</span>';
        }
      } catch(e) {
        clearInterval(liveInterval);
        if (e.name === 'AbortError') {
          aDiv.innerHTML = '<strong style="color:var(--red)">⏹ [DURDURULDU]: İşlem kullanıcı tarafından durduruldu.</strong>';
        } else {
          let errText = e.message;
          if (window.location.protocol === 'https:' && (errText.includes('Failed to fetch') || errText.includes('NetworkError') || errText.includes('Load failed'))) {
            errText += '<br><br>⚠️ <strong>Tarayıcı İzolasyon Engeli (Mixed Content):</strong><br>Tarayıcınız HTTPS sayfasından yerel HTTP servisine (127.0.0.1:5050) erişimi engelliyor.<br>👉 <strong>Çözüm:</strong> Arayüzü doğrudan yerel adresinden açın: <a href="http://127.0.0.1:5050" target="_blank" style="color:#2f81f7; text-decoration:underline; font-weight:bold;">http://127.0.0.1:5050</a>';
          }
          aDiv.innerHTML = '<span style="color:#f85149">Bağlantı Hatası: ' + errText + '</span>';
        }
      } finally {
        currentAbortController = null;
        sendBtn.disabled = false;
        sendBtn.textContent = 'İCRA ET';
        sendBtn.style.opacity = '1';
        stopBtn.style.display = 'none';
        input.focus();
        feed.scrollTop = feed.scrollHeight;
      }
    }
  </script>
</body>
