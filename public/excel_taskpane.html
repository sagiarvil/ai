<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Barış AI // Canlı Kokpit & Excel İcra Motoru</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #080c14; color: #e2e8f0; height: 100vh;
      display: flex; flex-direction: column; font-size: 12px;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1px solid #1e293b;
    }
    .badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px;
      border-radius: 4px; background: #0284c7; color: #fff;
      letter-spacing: 0.5px;
    }
    .status-card {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 6px;
      padding: 6px 10px; margin: 8px 0 6px 0; display: flex; justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px; color: #38bdf8;
    }
    .quick-chips {
      display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .chip {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      border-radius: 12px; padding: 3px 8px; font-size: 10px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      background: #2563eb; color: #fff; border-color: #3b82f6;
    }
    .chat-view {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 8px; margin-bottom: 8px; padding-right: 2px;
    }
    .bubble {
      padding: 10px 12px; border-radius: 8px; line-height: 1.5;
      max-width: 95%; word-break: break-word; font-size: 12px; white-space: pre-wrap;
    }
    .bubble.user {
      background: #1d4ed8; color: #fff; align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .bubble.ai {
      background: #0f172a; border: 1px solid #1e293b; color: #cbd5e1;
      align-self: flex-start; border-bottom-left-radius: 2px;
    }
    .bubble.ai .step {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: #34d399; margin-top: 4px;
    }
    .input-box {
      display: flex; flex-direction: column; gap: 6px;
    }
    textarea {
      width: 100%; height: 70px; background: #0f172a; border: 1px solid #334155;
      border-radius: 6px; color: #f8fafc; padding: 8px; resize: none; outline: none;
      font-size: 12px; font-family: inherit;
    }
    textarea:focus { border-color: #38bdf8; }
    .controls { display: flex; gap: 6px; align-items: center; }
    select {
      background: #0f172a; border: 1px solid #334155; color: #cbd5e1;
      border-radius: 6px; padding: 6px 8px; font-size: 11px; flex: 1; outline: none;
    }
    button.send-btn {
      background: #2563eb; color: #fff; border: none;
      padding: 6px 18px; border-radius: 6px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; min-width: 75px;
    }
    button.send-btn:hover { background: #1d4ed8; }
    button.send-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <strong>BARIŞ AI // CANLI KOKPİT</strong>
    <span class="badge">v2.0 CANLI</span>
  </div>

  <div class="status-card">
    <span id="active-info">Sayfa: Tespit ediliyor...</span>
    <span id="engine-status">⚡ Hazır</span>
  </div>

  <div class="quick-chips">
    <button class="chip" onclick="runQuick('yeni bir sayfa ac ve adını toptacılar oılarak yaz')">➕ Toptancılar Sayfası Aç</button>
    <button class="chip" onclick="runQuick('bu sayfadaki verileri ve formülleri SPK standartlarında denetle, hata var mı?')">🔍 Sayfayı Denetle</button>
    <button class="chip" onclick="runQuick('TDHP standartlarında 3 sekmeli Finansal Model kur')">📑 TDHP Finansal Model</button>
    <button class="chip" onclick="runQuick('canlı ekran kontrolünü aç ve Google aç')">🖥️ Ekranı Aç</button>
  </div>

  <div class="chat-view" id="chat">
    <div class="bubble ai">
      Hazır. Ekranda açık olan sayfayı analiz ettirebilir (örn: "bu sayfada hata var mı", "kalan alacakları yorumla") veya doğrudan Excel komutları vererek sayfa ve tablolar kurdurabilirsiniz.
    </div>
  </div>

  <div class="input-box">
    <textarea id="prompt" placeholder="Sorunuzu veya talimatınızı yazın... (Enter ile gönder)"></textarea>
    <div class="controls">
      <select id="model-select">
        <option value="qwen-coder-14b-abliterated:latest" selected>⚡ Qwen 2.5 Coder (Ultra Hızlı & İcracı)</option>
        <option value="deepseek-r1-14b-abliterated:latest">🧠 DeepSeek R1 14B (Derin Akıl Yürütme)</option>
      </select>
      <button class="send-btn" id="send-btn" onclick="sendAction()">Gönder</button>
    </div>
  </div>

  <script>
    let activeSheetName = "Projeler";

    Office.onReady(() => {
      refreshSheet();
      try {
        Excel.run(async (context) => {
          context.workbook.worksheets.onActivated.add(refreshSheet);
          await context.sync();
        });
      } catch (e) {}

      document.getElementById("prompt").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendAction();
        }
      });
    });

    async function refreshSheet() {
      try {
        await Excel.run(async (context) => {
          const sheet = context.workbook.worksheets.getActiveWorksheet();
          sheet.load("name");
          await context.sync();
          activeSheetName = sheet.name;
          document.getElementById("active-info").innerText = "Sayfa: " + sheet.name;
        });
      } catch (e) {}
    }

    async function getSheetSample() {
      let data = [];
      try {
        await Excel.run(async (context) => {
          const sheet = context.workbook.worksheets.getActiveWorksheet();
          const range = sheet.getUsedRangeOrNullObject();
          range.load(["values", "address"]);
          await context.sync();
          if (!range.isNullObject && range.values) {
            data = range.values;
          }
        });
      } catch (e) {}
      return data;
    }

    function runQuick(cmdText) {
      document.getElementById("prompt").value = cmdText;
      sendAction();
    }

    // =========================================================================
    // 360° OFFICE.JS CANLI EYLEM İCRA MOTORU (WORKBOOK MUTATION ENGINE)
    // =========================================================================
    async function executeOfficeActions(actions) {
      if (!actions || !Array.isArray(actions) || actions.length === 0) return [];
      const executionLogs = [];

      await Excel.run(async (context) => {
        const sheets = context.workbook.worksheets;
        sheets.load("items/name");
        await context.sync();

        for (const act of actions) {
          // 1. SAYFA AÇMA (ADD_SHEET)
          if (act.type === "add_sheet") {
            const reqName = (act.name || "Yeni Sayfa").trim();
            let existing = sheets.items.find(s => s.name.toLowerCase() === reqName.toLowerCase());
            let targetSheet;
            if (existing) {
              targetSheet = existing;
              executionLogs.push("ℹ️ '" + existing.name + "' sayfası zaten mevcuttu, aktifleştirildi.");
            } else {
              targetSheet = sheets.add(reqName);
              executionLogs.push("✅ '" + reqName + "' sayfası başarıyla oluşturuldu.");
            }
            if (act.activate !== false) {
              targetSheet.activate();
            }
            await context.sync();
          }

          // 2. TABLO OLUŞTURMA VE BİÇİMLENDİRME (WRITE_TABLE)
          else if (act.type === "write_table") {
            let sheet;
            if (act.sheet) {
              sheet = context.workbook.worksheets.getItemOrNullObject(act.sheet);
              await context.sync();
              if (sheet.isNullObject) {
                sheet = context.workbook.worksheets.add(act.sheet);
                await context.sync();
              }
            } else {
              sheet = context.workbook.worksheets.getActiveWorksheet();
            }
            sheet.activate();

            const startCell = act.start_cell || "A1";
            const headers = act.headers || [];
            const rows = act.rows || [];
            const colCount = headers.length > 0 ? headers.length : (rows[0] ? rows[0].length : 0);

            if (colCount > 0) {
              // A) Başlık Satırı
              if (headers.length > 0) {
                const headerRange = sheet.getRange(startCell).getResizedRange(0, colCount - 1);
                headerRange.values = [headers];
                headerRange.format.font.bold = true;
                headerRange.format.fill.color = act.header_bg || "#1e3a8a";
                headerRange.format.font.color = "#ffffff";
                headerRange.format.horizontalAlignment = "Center";
              }

              // B) Veri Satırları & Formüller
              if (rows.length > 0) {
                const dataStart = sheet.getRange(startCell).getOffsetRange(headers.length > 0 ? 1 : 0, 0);
                const dataRange = dataStart.getResizedRange(rows.length - 1, colCount - 1);

                const valuesMatrix = [];
                const formulasMatrix = [];
                let hasFormulas = false;

                for (let r = 0; r < rows.length; r++) {
                  const vRow = [];
                  const fRow = [];
                  for (let c = 0; c < colCount; c++) {
                    const cVal = rows[r][c] !== undefined ? rows[r][c] : "";
                    if (typeof cVal === "string" && cVal.startsWith("=")) {
                      vRow.push("");
                      fRow.push(cVal);
                      hasFormulas = true;
                    } else {
                      vRow.push(cVal);
                      fRow.push("");
                    }
                  }
                  valuesMatrix.push(vRow);
                  formulasMatrix.push(fRow);
                }

                dataRange.values = valuesMatrix;

                if (hasFormulas) {
                  for (let r = 0; r < rows.length; r++) {
                    for (let c = 0; c < colCount; c++) {
                      if (formulasMatrix[r][c]) {
                        dataStart.getOffsetRange(r, c).formulas = [[formulasMatrix[r][c]]];
                      }
                    }
                  }
                }

                // C) Izgara & Kenarlıklar & Otomatik Sütun Genişliği
                const totalRows = (headers.length > 0 ? 1 : 0) + rows.length;
                const fullTable = sheet.getRange(startCell).getResizedRange(totalRows - 1, colCount - 1);
                try {
                  fullTable.format.borders.getItem("InsideHorizontal").style = "Continuous";
                  fullTable.format.borders.getItem("InsideHorizontal").color = "#cbd5e1";
                  fullTable.format.borders.getItem("InsideVertical").style = "Continuous";
                  fullTable.format.borders.getItem("InsideVertical").color = "#cbd5e1";
                  fullTable.format.borders.getItem("EdgeBottom").style = "Continuous";
                  fullTable.format.borders.getItem("EdgeBottom").color = "#94a3b8";
                } catch(bErr) {}
                fullTable.format.autofitColumns();
              }
              executionLogs.push("✅ " + colCount + " sütunlu tablo ve formüller uygulandı.");
            }
            await context.sync();
          }

          // 3. DOĞRUDAN ARALIK GÜNCELLEME (SET_RANGE)
          else if (act.type === "set_range") {
            let sheet = act.sheet ? context.workbook.worksheets.getItem(act.sheet) : context.workbook.worksheets.getActiveWorksheet();
            const range = sheet.getRange(act.range);
            if (act.values) range.values = act.values;
            if (act.formulas) range.formulas = act.formulas;
            await context.sync();
            executionLogs.push("✅ " + act.range + " aralığı güncellendi.");
          }

          // 4. BİÇİMLENDİRME (FORMAT_RANGE)
          else if (act.type === "format_range") {
            let sheet = act.sheet ? context.workbook.worksheets.getItem(act.sheet) : context.workbook.worksheets.getActiveWorksheet();
            const range = sheet.getRange(act.range);
            if (act.bold !== undefined) range.format.font.bold = act.bold;
            if (act.bg_color) range.format.fill.color = act.bg_color;
            if (act.font_color) range.format.font.color = act.font_color;
            if (act.number_format) range.numberFormat = [[act.number_format]];
            await context.sync();
            executionLogs.push("✅ " + act.range + " aralığı biçimlendirildi.");
          }
        }
      });

      return executionLogs;
    }

    async function sendAction() {
      const input = document.getElementById("prompt");
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById("chat");
      const model = document.getElementById("model-select").value;
      const sendBtn = document.getElementById("send-btn");
      const engineStatus = document.getElementById("engine-status");

      const uMsg = document.createElement("div");
      uMsg.className = "bubble user";
      uMsg.innerText = text;
      chat.appendChild(uMsg);
      input.value = "";

      const aiMsg = document.createElement("div");
      aiMsg.className = "bubble ai";
      aiMsg.innerHTML = "<div>⏳ <strong>İnceleniyor...</strong> (Niyet ve eylemler çözümleniyor)</div>";
      chat.appendChild(aiMsg);
      chat.scrollTop = chat.scrollHeight;

      sendBtn.disabled = true;
      engineStatus.innerText = "⚙️ İşleniyor...";

      await refreshSheet();
      const grid = await getSheetSample();

      try {
        const res = await fetch("http://127.0.0.1:5050/api/excel_smart_router", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: text,
            sheet_name: activeSheetName,
            sheet_data: grid.slice(0, 40),
            model: model
          })
        });

        const data = await res.json();

        // 1. EYLEM İCRA MODU (ACTION MODE)
        if (data.mode === "action") {
          if (data.actions && data.actions.length > 0) {
            aiMsg.innerHTML = "<div>⚙️ <strong>Excel eylemleri icra ediliyor...</strong></div>";
            chat.scrollTop = chat.scrollHeight;

            const actionLogs = await executeOfficeActions(data.actions);
            await refreshSheet();

            let logHtml = actionLogs.map(l => "<div class='step'>" + l + "</div>").join("");
            aiMsg.innerHTML = "<div>" + (data.reply || "✅ İşlem başarıyla icra edildi.") + "</div><div style='margin-top:6px;'>" + logHtml + "</div>";
          } else {
            aiMsg.innerText = data.reply || "✅ Komut icra edildi.";
          }
        }
        // 2. DENETİM MODU (AUDIT MODE)
        else if (data.mode === "audit") {
          aiMsg.innerText = data.reply || "Denetim tamamlandı.";
        }
        // 3. DİĞER VEYA HATA
        else {
          aiMsg.innerText = data.reply || data.message || "İşlem tamamlandı.";
        }
      } catch (err) {
        aiMsg.innerHTML = "<span style='color:#f87171;'>❌ Bağlantı veya İcra Hatası:</span> " + err.message;
      } finally {
        sendBtn.disabled = false;
        engineStatus.innerText = "⚡ Hazır";
        chat.scrollTop = chat.scrollHeight;
      }
    }
  </script>
</body>
</html>
